name: Build Video Downloader APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter Project
        run: |
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found!"
            exit 1
          }

      - name: Generate Android Project
        run: |
          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --org com.safisafi.downloader \
              --project-name video_downloader .
          fi

      - name: Add Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace("<application", permission + "\\n    <application", 1)
          p.write_text(s)
          PY

      - name: Clean Project
        run: flutter clean

      - name: Install Flutter Packages
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated!"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Video-Downloader-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
